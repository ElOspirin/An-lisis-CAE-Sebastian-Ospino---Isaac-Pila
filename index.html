<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<title>Plataforma de Análisis Financiero: CAE</title>
<style>
:root{color-scheme:dark;--bg:#0f1216;--card:#161b22;--card2:#1c232c;--tx:#eef2f6;--mut:#94a0ad;--y:#f5c400;--b:#00a2ff;--r:#ff2a2a;--ln:#2a323d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 14px 14px,rgba(255,255,255,.035) 0 6px,transparent 7px) 0 0/28px 28px,radial-gradient(900px 400px at 15% -5%,rgba(0,162,255,.14),transparent),radial-gradient(900px 400px at 90% -5%,rgba(255,42,42,.12),transparent),var(--bg);color:var(--tx);font-family:"Segoe UI",Inter,Roboto,Arial,sans-serif;line-height:1.5;padding:20px 16px 48px}
.wrap{max-width:1120px;margin:auto}
header{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:52px;height:52px;border-radius:10px;background:var(--y);display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:9px;box-shadow:0 6px 0 #b89300}
.logo i{background:#d9a900;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
h1{font-size:clamp(1.15rem,3.2vw,1.7rem);margin:0;letter-spacing:.2px}
.sub{color:var(--mut);font-size:.92rem}
.pill{display:inline-flex;background:var(--card);border:1px solid var(--y);border-radius:99px;padding:3px}
.pill button{background:none;border:0;color:var(--mut);padding:7px 16px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer}
.pill button.on{background:var(--y);color:#111}
.intro{margin:22px 0;background:linear-gradient(135deg,#1d2630,#161b22);border:1px solid var(--ln);border-left:6px solid var(--y);border-radius:14px;padding:20px 22px}
.intro h2{margin:0 0 6px;font-size:1.15rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:.92rem}
.step b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--y);color:#111;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:34px 20px;margin-top:26px}
.panel{--c:var(--b);position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card) 180px);border:2px solid var(--y);border-radius:16px;padding:20px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.panel::before{content:"";position:absolute;left:18px;right:18px;top:-11px;height:11px;background:radial-gradient(circle at 12px 11px,var(--c) 0 6px,transparent 7px) 0 0/28px 11px repeat-x}
.ph{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:14px;margin-bottom:6px}
.ph svg{width:92px;height:auto;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#111;background:var(--c);border-radius:5px;padding:2px 8px}
.ph h2{margin:6px 0 2px;font-size:1.2rem}
.f{padding:12px 0;border-bottom:1px dashed var(--ln)}.f:last-child{border:0}
.f label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.sym{flex:none;min-width:24px;height:24px;border-radius:6px;background:var(--c);color:#111;font-weight:800;display:grid;place-items:center;font-size:.85rem;font-style:italic;padding:0 6px}
.hint{color:var(--mut);font-size:.8rem;margin:2px 0 8px 32px}
.in{margin-left:32px;display:flex;align-items:center;gap:10px}
.money{flex:1;display:flex;align-items:center;background:#0d1015;border:1px solid var(--ln);border-radius:10px;padding:0 12px}
.money:focus-within{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.money span{color:var(--mut)}
.money input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:1.05rem;font-weight:600;padding:10px 8px;outline:0}
input[type=range]{flex:1;accent-color:var(--c);height:6px}
.val{min-width:84px;text-align:center;background:#0d1015;border:1px solid var(--ln);border-radius:10px;padding:8px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 8px;align-items:center}
.btn{border:0;border-radius:10px;padding:13px 24px;font:inherit;font-weight:800;cursor:pointer;background:var(--y);color:#111;box-shadow:0 5px 0 #b89300;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b89300}
.ghost{background:none;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}
.live{color:var(--mut);font-size:.85rem}.live::before{content:"●";color:#3ddc84;margin-right:6px}
.res{margin-top:20px;background:var(--card);border:2px solid var(--y);border-radius:16px;padding:22px}
.res>h2{margin:0 0 14px;color:var(--y);font-size:1.25rem}
.win{--c:var(--b);display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,#0d1015),#0d1015);border:1px solid var(--c);border-radius:14px;padding:18px 20px;animation:pop .4s}
@keyframes pop{from{transform:scale(.97);opacity:.5}}
.win .tr{font-size:2.6rem}
.win .k{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--c);font-weight:800}
.win .big{font-size:clamp(1.3rem,4vw,1.9rem);font-weight:800}
.bars{margin:20px 0}
.bar{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;margin:10px 0}
.track{height:26px;background:#0d1015;border-radius:8px;overflow:hidden;border:1px solid var(--ln)}
.track i{display:block;height:100%;width:0;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar b{min-width:130px;text-align:right}
.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.bk{background:var(--card2);border-radius:12px;padding:14px;border-top:4px solid var(--c)}
.bk h3{margin:0 0 8px;font-size:.95rem}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:5px 0;border-bottom:1px solid var(--ln)}
.ln span:first-child{color:var(--mut)}.ln.t{border:0;font-weight:800;font-size:.95rem;padding-top:8px}
.why{margin-top:16px;padding:14px 16px;background:#0d1015;border-left:5px solid var(--y);border-radius:8px}
.sec{margin-top:26px}.sec>h2{font-size:1.15rem;margin:0 0 12px}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.g{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
.g .sym{background:var(--y);margin-bottom:8px;width:max-content}
.g b{display:block}.g p{margin:4px 0 0;color:var(--mut);font-size:.85rem}
details{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-top:14px}
summary{cursor:pointer;color:var(--y);font-weight:700}
code{display:block;margin-top:10px;background:#0d1015;padding:10px;border-radius:8px;overflow-x:auto;font-size:.82rem;white-space:nowrap}
.qrw{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:12px}
#qrbox{background:#fff;padding:10px;border-radius:10px;min-width:200px;min-height:200px}
.qrw input{width:100%;background:#0d1015;border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:10px;font:inherit}
.intro{position:relative}.r2{position:absolute;right:22px;top:14px;width:66px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.intro>h2,.intro>#t_ip{padding-right:84px}
.panel.champ{box-shadow:0 0 0 3px var(--c),0 0 44px color-mix(in srgb,var(--c) 45%,transparent)}
.panel.champ::after{content:attr(data-badge);position:absolute;top:-17px;right:22px;background:var(--y);color:#111;font-weight:800;font-size:.78rem;padding:3px 13px;border-radius:99px}
.viz{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:22px 0}
.vc{background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:14px}.vc h3{margin:0 0 8px;font-size:.95rem}
.lg{display:flex;gap:14px;font-size:.8rem;margin-bottom:4px}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.towers{display:flex;gap:30px;justify-content:center;align-items:flex-end;min-height:230px;padding-top:10px}
.tw{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.st{display:flex;flex-direction:column-reverse;gap:6px}
.st i{position:relative;width:78px;height:17px;background:var(--c);border-radius:3px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);animation:drop .45s both}
.st i::before{content:"";position:absolute;top:-5px;left:12px;width:14px;height:5px;border-radius:3px 3px 0 0;background:var(--c);box-shadow:30px 0 0 var(--c)}
@keyframes drop{from{transform:translateY(-34px);opacity:0}}
.cf{position:fixed;top:28%;left:50%;width:14px;height:10px;border-radius:2px;z-index:9;pointer-events:none;animation:cf 1.3s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),520px) rotate(var(--r));opacity:0}}
@media(max-width:560px){.bar{grid-template-columns:1fr;gap:4px}.bar b{text-align:left}.ph svg{width:70px}.r2{display:none}.intro>h2,.intro>#t_ip{padding-right:0}}

<script>/* Generador QR incluido (Kazuhiko Arase, licencia MIT): funciona sin internet */
(function(){var M={},C={};function req(p){var n=p.replace("./","");if(!C[n]){var m={exports:{}};C[n]=m;M[n](m,req);}return C[n].exports;}
M["QRErrorCorrectLevel"]=function(module,require){module.exports = {
	L : 1,
	M : 0,
	Q : 3,
	H : 2
};


};
M["QRPolynomial"]=function(module,require){var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};
M["QRMaskPattern"]=function(module,require){module.exports = {

	PATTERN001 : 1,
	PATTERN010 : 2,
	PATTERN011 : 3,
	PATTERN100 : 4,
	PATTERN101 : 5,
	PATTERN110 : 6,

        [6, 28, 50, 72, 94],
        [6, 26, 50, 74, 98],
        [6, 30, 54, 78, 102],
        [6, 28, 54, 80, 106],
        [6, 32, 58, 84, 110],
        [6, 30, 58, 86, 114],
        [6, 34, 62, 90, 118],
        [6, 26, 50, 74, 98, 122],
        [6, 30, 54, 78, 102, 126],
        [6, 26, 52, 78, 104, 130],
        [6, 30, 56, 82, 108, 134],
        [6, 34, 60, 86, 112, 138],
        [6, 30, 58, 86, 114, 142],
        [6, 34, 62, 90, 118, 146],
        [6, 30, 54, 78, 102, 126, 150],
        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {

	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );

	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

};
